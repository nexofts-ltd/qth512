name: Release
# Publishes to npm when a GitHub release is published (tag vX.Y.Z).
# Uses npm trusted publishing (OIDC): no NPM_TOKEN secret is stored, and npm
# adds a provenance statement linking the package to this workflow run.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
      # Node 24 ships npm 11, which supports trusted publishing.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check tag matches package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json version $VERSION"
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      # prepublishOnly builds dist/ and runs the Bun and Node tests first.
      - run: npm publish
